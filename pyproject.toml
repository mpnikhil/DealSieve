[project]
name = "dealsieve"
version = "0.1.0"
description = "Persistent acquisition agent: rejects deals, remembers why, watches what would change its mind."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "strands-agents[openai,anthropic]==1.55.1",
  "strands-agents-tools>=0.8.8",
  "bedrock-agentcore>=1.23.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.133",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "rapidfuzz>=3.9",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "fpdf2>=2.8",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
dealsieve = "dealsieve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dealsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: requires a real model backend (claude/codex/agy CLI or API keys); excluded by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
