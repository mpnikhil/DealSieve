<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DealSieve — the system at a glance</title>
<style>
  :root {
    --paper: #f8fafc; --ink: #0f172a; --ink2: #334155; --dim: #64748b; --line: #e2e8f0;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "JetBrains Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); width: 100%; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  svg { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  text { font-family: var(--sans); fill: var(--ink); }
  .mono { font-family: var(--mono); }
  .shadow { filter: drop-shadow(0 1px 2px rgba(15,23,42,.05)) drop-shadow(0 10px 30px rgba(15,23,42,.07)); }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(() => {
"use strict";
const q = new URLSearchParams(location.search);
// ?font=Georgia checks the layout under another typeface: every line below is measured in the
// browser and wrapped or shrunk to fit, so the picture holds on any machine.
if (q.get("font")) { document.documentElement.style.setProperty("--sans", q.get("font")); document.documentElement.style.setProperty("--mono", q.get("font")); }

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const C = {
  amber: "#b45309", amberT: "#fff7ed", blue: "#1d4ed8", blueT: "#eff6ff", green: "#15803d", greenT: "#f0fdf4",
  slate: "#475569", slateT: "#f1f5f9", ink: "#0f172a", ink2: "#334155", dim: "#64748b", line: "#e2e8f0",
  accent: "#ea580c", cloud: "#f3f6fb", cloudLine: "#dbe3ee",
};
const el = (tag, attrs = {}, parent = svg) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n); return n;
};
const txt = (x, y, s, attrs = {}, parent = svg) => { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; };
const measure = (t) => { try { return t.getComputedTextLength(); } catch (e) { return 0; } };
const fit = (t, maxW, minSize = 13) => {           // shrink a line until it fits its box
  let fs = parseFloat(t.getAttribute("font-size"));
  while (measure(t) > maxW && fs > minSize) { fs -= 0.5; t.setAttribute("font-size", fs); }
  return t;
};
const wrap = (x, y, s, maxW, attrs, parent, lineH) => {   // word-wrap by measurement
  const out = []; let cur = ""; let t = txt(x, y, "", attrs, parent);
  for (const w of s.split(" ")) {
    const cand = cur ? cur + " " + w : w;
    t.textContent = cand;
    if (measure(t) > maxW && cur) { t.textContent = cur; out.push(t); cur = w; t = txt(x, y + out.length * lineH, w, attrs, parent); }
    else cur = cand;
  }
  t.textContent = cur; out.push(t); return out;
};
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const ease = (u) => { u = clamp01(u); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };
const win = (f, a, b) => clamp01((f - a) / Math.max(1e-6, b - a));

const gBack = el("g"), gEdges = el("g"), gBlocks = el("g"), gDeco = el("g"), gAnim = el("g");

// ---------------------------------------------------------------- geometry
const BLOCK_Y = 236, BLOCK_H = 440, BLOCK_BOTTOM = BLOCK_Y + BLOCK_H;      // 676
const BAND_Y = 700, BAND_H = 160;                                            // 700..860
const CLOUD = { x: 488, y: 150, w: 912, h: 736 };                            // ..886
const LOOP_Y = 910;
const AGENTS_X = 528, ENGINE_X = 976, BLOCK_W = 392, HUMAN_X = 1448, SIDE_W = 320, HUMAN_W = 352;
const AGENTS_CX = AGENTS_X + BLOCK_W / 2, ENGINE_CX = ENGINE_X + BLOCK_W / 2, HUMAN_CX = HUMAN_X + HUMAN_W / 2;
const GAP_X = (AGENTS_X + BLOCK_W + ENGINE_X) / 2;                            // 946

// ---------------------------------------------------------------- header
txt(120, 84, "DealSieve", { "font-size": 26, "font-weight": 600, fill: C.ink, "letter-spacing": -0.3 }, gDeco);
txt(256, 84, "The system at a glance", { "font-size": 26, fill: C.dim }, gDeco);
const legend = el("g", {}, gDeco);
{
  let x = 1800;
  for (const [col, label] of [[C.green, "you approve"], [C.blue, "code decides"], [C.amber, "agents judge"]]) {
    const t = txt(0, 84, label, { "font-size": 20, fill: C.ink2 }, legend);
    const w = measure(t);
    t.setAttribute("x", x - w);
    el("circle", { cx: x - w - 16, cy: 77, r: 6, fill: col }, legend);
    x = x - w - 16 - 30;
  }
}

// ---------------------------------------------------------------- the platform container
const cloud = el("g", {}, gBack);
el("rect", { x: CLOUD.x, y: CLOUD.y, width: CLOUD.w, height: CLOUD.h, rx: 26, fill: C.cloud, stroke: C.cloudLine, "stroke-width": 1.5, "stroke-dasharray": "10 8" }, cloud);
const cloudLabel = el("g", {}, cloud);
const pillRect = el("rect", { x: 520, y: 132, width: 10, height: 36, rx: 18, fill: "#fff", stroke: C.cloudLine, "stroke-width": 1.5 }, cloudLabel);
const pillText = fit(txt(544, 157, "Built with the Strands Agents SDK  ·  runs on Amazon Bedrock AgentCore Runtime", { "font-size": 19, "font-weight": 600, fill: C.ink2 }, cloudLabel), 830);
pillRect.setAttribute("width", measure(pillText) + 48);
const cloudNote = fit(txt(524, CLOUD.y + CLOUD.h - 10, "one deployment · the same code runs offline", { "font-size": 17, fill: C.dim, class: "mono" }, cloud), 430);

// ---------------------------------------------------------------- icons
const ICON = {
  inbox: "M3 5h18v14H3z M3 13h5l2 3h4l2-3h5",
  agent: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-7 8-7s8 3 8 7",
  calc: "M5 2h14v20H5z M8 6h8 M8 11h2 M12 11h2 M16 11h2 M8 15h2 M12 15h2 M16 15h2 M8 19h2 M12 19h6",
  phone: "M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M10 19h4",
  db: "M12 3c5 0 9 1.3 9 3s-4 3-9 3-9-1.3-9-3 4-3 9-3z M3 6v12c0 1.7 4 3 9 3s9-1.3 9-3V6 M3 12c0 1.7 4 3 9 3s9-1.3 9-3",
  memory: "M4 4h16v16H4z M9 9h6v6H9z M9 2v2 M15 2v2 M9 20v2 M15 20v2 M2 9h2 M2 15h2 M20 9h2 M20 15h2",
};

// ---------------------------------------------------------------- the four blocks (one height, one rhythm)
const BLOCKS = {
  intake: { x: 120, w: SIDE_W, col: C.slate, tint: C.slateT, icon: "inbox",
    kicker: "AMBIENT INTAKE", title: "Watches the inbox",
    facts: ["Broker packages and the attached OMs", "Price cuts and replies in the same thread", "Inspection reports with their photos", "Telegram and the dashboard"],
    rule: "Wakes only when mail arrives" },
  agents: { x: AGENTS_X, w: BLOCK_W, col: C.amber, tint: C.amberT, icon: "agent",
    kicker: "STRANDS AGENTS SDK", title: "Read and judge",
    facts: ["Acquisition agent: pulls out the claims and cites the page or the photo for each one", "Skeptic agent: argues what the package doesn't back up", "Inspector agent: reads the reports and their photographs"],
    rule: "No arithmetic. Cannot send anything." },
  engine: { x: ENGINE_X, w: BLOCK_W, col: C.blue, tint: C.blueT, icon: "calc",
    kicker: "DETERMINISTIC ENGINE", title: "Math and guardrails",
    facts: ["Every dollar computed in code, exactly, under your frozen policy", "For every pass, the price at which the deal would actually work", "Screens every outgoing draft: money and first contact stop here"],
    rule: "Hard rules in code, not in a prompt" },
  human: { x: HUMAN_X, w: HUMAN_W, col: C.green, tint: C.greenT, icon: "phone",
    kicker: "HUMAN IN THE LOOP", title: "You decide",
    facts: ["Approve the first email to any broker. Follow-ups then go out on their own.", "Approve anything about money: credits, offers, terms.", "Otherwise it stays quiet until a deal's answer changes."],
    rule: "Three taps across the life of a deal" },
};
const blockEls = {};
for (const [id, b] of Object.entries(BLOCKS)) {
  const g = el("g", { class: "shadow" }, gBlocks);
  const rect = el("rect", { x: b.x, y: BLOCK_Y, width: b.w, height: BLOCK_H, rx: 20, fill: "#fff", stroke: C.line, "stroke-width": 1.5 }, g);
  el("rect", { x: b.x, y: BLOCK_Y, width: b.w, height: 92, rx: 20, fill: b.tint }, g);
  el("rect", { x: b.x, y: BLOCK_Y + 60, width: b.w, height: 32, fill: b.tint }, g);
  el("path", { d: ICON[b.icon], fill: "none", stroke: b.col, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round",
    transform: `translate(${b.x + 26},${BLOCK_Y + 26}) scale(1.6)` }, g);
  fit(txt(b.x + 78, BLOCK_Y + 40, b.kicker, { "font-size": 17, "font-weight": 700, fill: b.col, "letter-spacing": 2.4 }, g), b.w - 100);
  fit(txt(b.x + 78, BLOCK_Y + 72, b.title, { "font-size": 27, "font-weight": 650, fill: C.ink }, g), b.w - 100);
  const facts = [];
  let fy = BLOCK_Y + 136;
  const factW = b.w - 84;
  const size = b.facts.length > 3 ? 19 : 20, lineH = b.facts.length > 3 ? 24 : 25;
  for (const fact of b.facts) {
    el("circle", { cx: b.x + 34, cy: fy - 7, r: 4, fill: b.col }, g);
    const lines = wrap(b.x + 50, fy, fact, factW, { "font-size": size, fill: C.ink2 }, g, lineH);
    facts.push(...lines);
    fy += lineH * lines.length + 16;
  }
  const ruleY = BLOCK_BOTTOM - 34;
  el("rect", { x: b.x + 22, y: ruleY - 26, width: b.w - 44, height: 1, fill: C.line }, g);
  fit(txt(b.x + 26, ruleY + 4, b.rule, { "font-size": 18, "font-weight": 600, fill: b.col }, g), b.w - 52);
  blockEls[id] = { g, rect, facts, b };
}

// the memory band inside the platform container
const band = el("g", { class: "shadow" }, gBlocks);
const BAND_X = AGENTS_X, BAND_W = ENGINE_X + BLOCK_W - AGENTS_X;   // 528..1368
el("rect", { x: BAND_X, y: BAND_Y, width: BAND_W, height: BAND_H, rx: 20, fill: "#fff", stroke: C.line, "stroke-width": 1.5 }, band);
el("rect", { x: BAND_X, y: BAND_Y, width: BAND_W, height: 46, rx: 20, fill: C.slateT }, band);
el("rect", { x: BAND_X, y: BAND_Y + 24, width: BAND_W, height: 22, fill: C.slateT }, band);
const bandKicker = txt(BAND_X + 28, BAND_Y + 31, "MEMORY", { "font-size": 17, "font-weight": 700, fill: C.slate, "letter-spacing": 2.4 }, band);
fit(txt(BAND_X + 28 + measure(bandKicker) + 24, BAND_Y + 31, "why it can pick a deal back up six weeks later, and why nothing is lost", { "font-size": 18, fill: C.dim }, band), BAND_W - 200);
const halfW = BAND_W / 2;
const half = (x, icon, title, line1, line2) => {
  el("path", { d: ICON[icon], fill: "none", stroke: C.slate, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", transform: `translate(${x},${BAND_Y + 66}) scale(1.5)` }, band);
  const t = fit(txt(x + 50, BAND_Y + 90, title, { "font-size": 24, "font-weight": 650 }, band), halfW - 90);
  fit(txt(x + 50, BAND_Y + 118, line1, { "font-size": 19, fill: C.ink2 }, band), halfW - 90);
  fit(txt(x + 50, BAND_Y + 143, line2, { "font-size": 18, fill: C.dim, class: "mono" }, band), halfW - 90);
  return t;
};
const ledgerTitle = half(BAND_X + 28, "db", "Append-only ledger", "every event, run and piece of evidence", "SQLite · never edited or deleted");
el("rect", { x: BAND_X + halfW, y: BAND_Y + 62, width: 1, height: 84, fill: C.line }, band);
const memTitle = half(BAND_X + halfW + 30, "memory", "Decision memory", "your past passes and prices, quoted back", "Amazon Bedrock AgentCore Memory");

// ---------------------------------------------------------------- the three promises
const PROMISES = [
  { x: 120, kicker: "AMBIENT", col: C.slate, text: "Watches, follows up on day 3 and day 6, then stops and tells you once. Otherwise silent." },
  { x: 680, kicker: "RELIABLE", col: C.blue, text: "Policy and guardrails are code, not prompts. Every claim is cited, every run is on the record." },
  { x: 1240, kicker: "UNDER YOUR CONTROL", col: C.green, text: "A first message to a broker waits for your tap. Anything about money always does." },
];
const promiseEls = PROMISES.map((p) => {
  const g = el("g", {}, gDeco);
  el("rect", { x: p.x, y: 928, width: 5, height: 92, rx: 2.5, fill: p.col }, g);
  fit(txt(p.x + 22, 948, p.kicker, { "font-size": 17, "font-weight": 700, fill: p.col, "letter-spacing": 2.4 }, g), 500);
  wrap(p.x + 22, 980, p.text, 500, { "font-size": 20, fill: C.ink2 }, g, 28);
  return g;
});
// platform strip, laid out by measurement
const PLATFORM = ["Strands Agents SDK", "Amazon Bedrock AgentCore Runtime", "AgentCore Memory", "Amazon Bedrock", "SQLite", "Telegram"];
const platEls = [];
{
  let x = 120;
  PLATFORM.forEach((s, i) => {
    // measured bold, since the items turn bold as the narration reaches them
    const t = txt(x, 1054, s, { "font-size": 19, fill: C.dim, class: "mono", "font-weight": 700 }, gDeco);
    platEls.push(t); x += measure(t) + 14; t.setAttribute("font-weight", 400);
    if (i < PLATFORM.length - 1) { const d = txt(x, 1054, "·", { "font-size": 19, fill: C.line }, gDeco); x += measure(d) + 14; }
  });
}

// ---------------------------------------------------------------- edges (few, big)
const EDGES = {
  inAg:  { d: `M${120 + SIDE_W},400 H${AGENTS_X}`, col: C.amber, t: [0.07, 0.10] },
  agEn:  { d: `M${AGENTS_X + BLOCK_W},400 H${ENGINE_X}`, col: C.blue, t: [0.40, 0.44] },
  enHu:  { d: `M${ENGINE_X + BLOCK_W},400 H${HUMAN_X}`, col: C.green, t: [0.74, 0.78] },
  enMem: { d: `M${ENGINE_CX},${BLOCK_BOTTOM} V${BAND_Y}`, col: C.slate, t: [0.60, 0.63] },
  memAg: { d: `M${AGENTS_CX},${BAND_Y} V${BLOCK_BOTTOM}`, col: C.slate, t: [0.66, 0.69] },
  loop:  { d: `M${HUMAN_CX},${BLOCK_BOTTOM} V${LOOP_Y} H280 V${BLOCK_BOTTOM}`, col: C.slate, dashed: true, t: [0.90, 0.97] },
};
const edgeEls = {};
for (const [id, e] of Object.entries(EDGES)) {
  const g = el("g", {}, gEdges);
  el("path", { d: e.d, fill: "none", stroke: C.line, "stroke-width": 3, "stroke-dasharray": e.dashed ? "8 8" : "none" }, g);
  const live = el("path", { d: e.d, fill: "none", stroke: e.col, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  const len = live.getTotalLength();
  live.setAttribute("stroke-dasharray", e.dashed ? "8 8" : `${len}`);
  const p1 = live.getPointAtLength(Math.max(0, len - 1)), p2 = live.getPointAtLength(len);
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
  el("polygon", { points: "0,0 -14,-7 -14,7", fill: C.line, transform: `translate(${p2.x},${p2.y}) rotate(${ang})` }, g);
  const head = el("polygon", { points: "0,0 -14,-7 -14,7", fill: e.col, transform: `translate(${p2.x},${p2.y}) rotate(${ang})` }, g);
  edgeEls[id] = { g, live, head, len, e };
}
const edgeLabel = (x, y, s, maxW, anchor = "middle") => fit(txt(x, y, s, { "font-size": 16, fill: C.dim, class: "mono", "text-anchor": anchor }, gDeco), maxW);
const labels = [
  edgeLabel((120 + SIDE_W + AGENTS_X) / 2, 384, "package", 84), edgeLabel(GAP_X, 384, "claims", 52),
  edgeLabel((ENGINE_X + BLOCK_W + HUMAN_X) / 2, 384, "verdict", 76),
  edgeLabel(ENGINE_CX + 14, BAND_Y - 6, "record", 120, "start"), edgeLabel(AGENTS_CX - 14, BAND_Y - 6, "recall", 120, "end"),
  edgeLabel(960, LOOP_Y - 10, "a reply, a price cut, a report → the whole path runs again", 900),
];

// ---------------------------------------------------------------- animation pieces
const motion = (d) => { const p = el("path", { d, fill: "none", stroke: "none" }, gAnim); return { p, len: p.getTotalLength() }; };
const M = {
  inAg: motion(`M300,400 H${AGENTS_X}`), agEn: motion(EDGES.agEn.d), enHu: motion(EDGES.enHu.d),
  enMem: motion(EDGES.enMem.d), loop: motion(EDGES.loop.d),
};
const mkPacket = (col, label) => {
  const g = el("g", { opacity: 0 }, gAnim);
  const t = txt(0, 6, label, { "font-size": 17, "font-weight": 700, fill: "#fff", "text-anchor": "middle", class: "mono" }, g);
  const w = measure(t) + 30;
  el("circle", { cx: -18, cy: 0, r: 22, fill: col, opacity: 0.12 }, g);
  g.insertBefore(el("rect", { x: -w / 2, y: -17, width: w, height: 34, rx: 17, fill: col }, g), t);
  return g;
};
const PK = { pkg: mkPacket(C.accent, "package"), claims: mkPacket(C.blue, "claims"), dec: mkPacket(C.green, "REVIEW"), rec: mkPacket(C.slate, "run #42"), reply: mkPacket(C.slate, "price cut") };
const place = (g, m, u) => { const pt = m.p.getPointAtLength(clamp01(u) * m.len); g.setAttribute("opacity", 1); g.setAttribute("transform", `translate(${pt.x},${pt.y})`); };
const hide = (g) => g.setAttribute("opacity", 0);
const mkChip = (x, y, s, col) => {
  const g = el("g", { opacity: 0 }, gAnim);
  const t = txt(x + 17, y + 25, s, { "font-size": 18, fill: C.ink2, class: "mono" }, g);
  const w = measure(t) + 34;
  g.insertBefore(el("rect", { x, y, width: w, height: 38, rx: 10, fill: "#fff", stroke: col, "stroke-width": 1.5 }, g), t);
  el("rect", { x, y, width: 5, height: 38, rx: 2.5, fill: col }, g);
  return g;
};
const CH = {
  claim: mkChip(AGENTS_X, 186, "cap rate 8.0% · p.3  →  6.4% on my numbers", C.amber),
  gate: mkChip(ENGINE_X, 186, "clears at $1.29M · REVIEW", C.blue),
  skp: mkChip(AGENTS_X, 186, "unsupported: roof age · Phase I · CAM", C.amber),
  mem: mkChip(BAND_X + halfW + 30, BAND_Y + BAND_H + 6, "You previously: passed at $1.29M", C.slate),
  tap: mkChip(HUMAN_X + 28, BLOCK_BOTTOM + 12, "Approve and send  ✓", C.green),
  money: mkChip(HUMAN_X + 28, BLOCK_BOTTOM + 12, "credit request: waits for you", C.green),
};
const ripple = el("circle", { cx: HUMAN_CX, cy: 500, r: 0, fill: "none", stroke: C.green, "stroke-width": 3, opacity: 0 }, gAnim);
const boundary = el("g", { opacity: 0 }, gAnim);
el("rect", { x: GAP_X - 2, y: BLOCK_Y, width: 4, height: BLOCK_H, rx: 2, fill: C.accent }, boundary);
{
  const t = txt(GAP_X, 604, "judgment ends here", { "font-size": 17, "font-weight": 700, fill: "#fff", "text-anchor": "middle", class: "mono" }, boundary);
  const w = measure(t) + 36;
  boundary.insertBefore(el("rect", { x: GAP_X - w / 2, y: 580, width: w, height: 34, rx: 8, fill: C.accent }, boundary), t);
}
const chip = (g, f, a, b) => { const o = Math.min(win(f, a, a + 0.012), 1 - win(f, b - 0.012, b)); g.setAttribute("opacity", o); g.setAttribute("transform", `translate(0,${(1 - ease(win(f, a, a + 0.012))) * 8})`); };

// ---------------------------------------------------------------- timeline (fractions of the block's narration)
// n8: built(0-4%) · inbox+agents(4-13%) · acquisition(13-29%) · inspector(29-36%) · read and judge / no arithmetic (36-45%)
//     · plain python (45-60%) · skeptic (60-67%) · ledger + memory (67-78%) · money screen + phone (78-89%) · platform (89-100%)
let DURATION = 47000;
const CUES = { intro: 0, intake: 0.05, agents: 0.10, boundary: 0.36, engine: 0.45, skeptic: 0.60, memory: 0.67, human: 0.78, platform: 0.89 };
window.setDuration = (ms) => { DURATION = ms; };
window.cues = () => Object.fromEntries(Object.entries(CUES).map(([k, v]) => [k, Math.round(v * DURATION)]));
const LIT = { intake: 0.07, agents: 0.10, engine: 0.44, human: 0.78 };

function setBlock(be, lit, hot) {
  be.rect.setAttribute("stroke", lit ? be.b.col : C.line);
  be.rect.setAttribute("stroke-width", lit ? 2.5 : 1.5);
  be.g.setAttribute("transform", `translate(0,${-4 * hot})`);
}
function render(f) {
  f = clamp01(f);
  const STATIC = f >= 1;
  cloud.setAttribute("opacity", ease(win(f, 0.0, 0.04)));
  legend.setAttribute("opacity", ease(win(f, 0.0, 0.03)));
  ["intake", "agents", "engine", "human"].forEach((id, i) => {
    const be = blockEls[id];
    be.g.setAttribute("opacity", ease(win(f, 0.01 + i * 0.008, 0.045 + i * 0.008)));
    const t0 = LIT[id];
    setBlock(be, f >= t0, f >= t0 ? 1 - win(f, t0, t0 + 0.03) : 0);
  });
  band.setAttribute("opacity", ease(win(f, 0.04, 0.075)));
  ledgerTitle.setAttribute("fill", f >= 0.63 ? C.slate : C.ink);
  memTitle.setAttribute("fill", f >= 0.69 ? C.slate : C.ink);
  band.setAttribute("transform", `translate(0,${-4 * (f >= 0.63 ? 1 - win(f, 0.63, 0.66) : 0)})`);
  promiseEls.forEach((g, i) => g.setAttribute("opacity", ease(win(f, 0.05 + i * 0.01, 0.085 + i * 0.01))));
  labels.forEach((t) => t.setAttribute("opacity", ease(win(f, 0.05, 0.08))));
  platEls.forEach((t, i) => {
    t.setAttribute("opacity", ease(win(f, 0.05, 0.08)));
    const lit = f >= 0.89 + i * 0.017;
    t.setAttribute("fill", lit ? C.ink : C.dim); t.setAttribute("font-weight", lit ? 700 : 400);
  });
  const platBeat = f >= 0.905 && f < 0.99;
  pillRect.setAttribute("stroke", platBeat ? C.ink2 : C.cloudLine);
  pillRect.setAttribute("stroke-width", platBeat ? 2.5 : 1.5);
  cloudNote.setAttribute("fill", platBeat ? C.ink2 : C.dim);
  Object.values(edgeEls).forEach((ee) => {
    ee.g.setAttribute("opacity", ease(win(f, 0.05, 0.08)));
    const u = win(f, ee.e.t[0], ee.e.t[1]);
    if (ee.e.dashed) ee.live.setAttribute("opacity", u); else ee.live.setAttribute("stroke-dashoffset", ee.len * (1 - u));
    ee.head.setAttribute("opacity", u >= 0.98 ? 1 : 0);
  });
  Object.values(PK).forEach(hide);
  if (f >= 0.06 && f < 0.10) place(PK.pkg, M.inAg, ease(win(f, 0.06, 0.10)));
  if (f >= 0.40 && f < 0.44) place(PK.claims, M.agEn, ease(win(f, 0.40, 0.44)));
  if (f >= 0.60 && f < 0.63) place(PK.rec, M.enMem, ease(win(f, 0.60, 0.63)));
  if (f >= 0.74 && f < 0.78) place(PK.dec, M.enHu, ease(win(f, 0.74, 0.78)));
  if (f >= 0.90 && f < 0.97) place(PK.reply, M.loop, ease(win(f, 0.90, 0.97)));
  chip(CH.claim, f, 0.14, 0.29);
  chip(CH.skp, f, 0.61, 0.67);
  chip(CH.gate, f, 0.47, 0.60);
  chip(CH.mem, f, 0.70, 0.78);
  chip(CH.tap, f, 0.80, 0.845);
  chip(CH.money, f, 0.85, 0.89);
  boundary.setAttribute("opacity", win(f, 0.36, 0.372) * (1 - win(f, 0.44, 0.452)));
  const ru = win(f, 0.795, 0.83);
  ripple.setAttribute("opacity", ru > 0 && ru < 1 ? (1 - ru) * 0.9 : 0);
  ripple.setAttribute("r", ru > 0 && ru < 1 ? 10 + 60 * ease(ru) : 0);
  if (STATIC) { Object.values(PK).forEach(hide); Object.values(CH).forEach(hide); boundary.setAttribute("opacity", 0); }
}

// ---------------------------------------------------------------- API
let playing = false, rafId = 0, t0 = 0;
window.seek = (ms) => { playing = false; if (rafId) cancelAnimationFrame(rafId); render(ms / DURATION); };
window.pause = () => { playing = false; if (rafId) cancelAnimationFrame(rafId); };
window.play = () => {
  playing = true; t0 = performance.now();
  const tick = (now) => { if (!playing) return; const ms = (now - t0) % (DURATION + 2500); render(Math.min(1, ms / DURATION)); rafId = requestAnimationFrame(tick); };
  rafId = requestAnimationFrame(tick);
};
window.renderStatic = () => { window.pause(); render(1); };
if (q.get("static") === "1") window.renderStatic(); else if (q.get("autoplay") !== "0") window.play(); else render(0);
})();
</script>
