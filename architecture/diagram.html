     tabular mono for figures, one orange accent. Three lanes = three boundaries. */

    --paper: #f8fafc; --ink: #0f172a; --ink2: #334155; --dim: #64748b; --line: #e2e8f0;
    --amber: #b45309; --amber-t: #fff7ed; --amber-l: #fdba74;

    --mono: "SF Mono", Menlo, "JetBrains Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); width: 100%; height: 100%; }
  /* The drawing is authored at 1920x1080 and scales to whatever window opens it, letterboxed.
     The film renderer opens it at exactly 1920x1080, so its frames are pixel-for-pixel. */
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  svg { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  text { font-family: var(--sans); fill: var(--ink); }
  .mono { font-family: var(--mono); }
  .node-shadow { filter: drop-shadow(0 1px 2px rgba(15,23,42,.06)) drop-shadow(0 8px 24px rgba(15,23,42,.06)); }
</style>

    platEls.push(t);
    x += s.length * 12.05 + 12;
    if (i < PLATFORM.length - 1) { txt(x, 1044, "·", { "font-size": 20, fill: C.line }, gDeco); x += 26; }
  });
}

// ------------------------------------------------------------------ timeline
let DURATION = 40000;
const CUES = { intro: 0, agents: 0.08, boundary: 0.36, engine: 0.453, skeptic: 0.60, ledger: 0.672, human: 0.78, platform: 0.89 };
window.setDuration = (ms) => { DURATION = ms; };
window.cues = () => Object.fromEntries(Object.entries(CUES).map(([k, v]) => [k, Math.round(v * DURATION)]));

const LIT = {  // node id -> time it lights
  src1: 0.07, src2: 0.07, src3: 0.07, acq: 0.117, ins: 0.29, nrm: 0.48, gate: 0.50, slv: 0.52,
  skp: 0.63, phone: 0.826, obx: 0.868, brk: 0.879, ledg: 0.70, mem: 0.72,
};
const NODE_ORDER = ["src1", "src2", "src3", "acq", "ins", "skp", "nrm", "gate", "slv", "phone", "obx", "brk", "ledg", "mem"];

function setNodeLit(ne, lit, hot) {
  // lit: 0..1 (stays), hot: 0..1 (brief pulse when the packet arrives)
  const stroke = lit > 0.5 ? ne.col : C.line;
  ne.rect.setAttribute("stroke", stroke);
  ne.rect.setAttribute("stroke-width", lit > 0.5 ? 2.2 : 1.5);
  ne.bar.setAttribute("opacity", lit);
  ne.title.setAttribute("fill", lit > 0.5 ? ne.col : C.ink);
  ne.ico.setAttribute("stroke", lit > 0.5 ? ne.col : C.dim);
  ne.g.setAttribute("transform", `translate(0,${-3 * hot})`);
}
function setDia(de, lit, hot) {
  de.poly.setAttribute("stroke", lit > 0.5 ? de.d.col : C.line);
  de.poly.setAttribute("stroke-width", lit > 0.5 ? 2.2 : 1.5);
  de.poly.setAttribute("fill", hot > 0 ? `rgba(29,78,216,${0.10 * hot})` : "#fff");
  de.ts.forEach((t) => t.setAttribute("fill", lit > 0.5 ? de.d.col : C.ink2));
  const s = 1 + 0.06 * hot;
  de.g.setAttribute("transform", `translate(${de.d.cx},${de.d.cy}) scale(${s}) translate(${-de.d.cx},${-de.d.cy})`);
}
function placePacket(pk, m, u, visible) {
  if (!visible) { pk.g.setAttribute("opacity", 0); return; }
  const pt = m.p.getPointAtLength(clamp01(u) * m.len);
  pk.g.setAttribute("opacity", 1);
  pk.g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
  // trail: offset back along the path
  const back = m.p.getPointAtLength(Math.max(0, clamp01(u) * m.len - 22));
  pk.trail.setAttribute("cx", back.x - pt.x); pk.trail.setAttribute("cy", back.y - pt.y);
  const back2 = m.p.getPointAtLength(Math.max(0, clamp01(u) * m.len - 44));
  pk.trail2.setAttribute("cx", back2.x - pt.x); pk.trail2.setAttribute("cy", back2.y - pt.y);
}
// a packet travels segments in sequence: [[motion, a, b], ...]; visible between first a and last b
function travel(pk, segs, f) {
  const a0 = segs[0][1], b1 = segs[segs.length - 1][2];
  if (f < a0 || f > b1) { placePacket(pk, null, 0, false); return; }
  for (const [m, a, b] of segs) {
    if (f <= b) { placePacket(pk, m, ease(win(f, a, b)), true); return; }
  }
}
function chip(g, f, a, b) {
  const inU = win(f, a, a + 0.012), outU = 1 - win(f, b - 0.012, b);
  const o = Math.min(inU, outU);
  g.setAttribute("opacity", o);
  g.setAttribute("transform", `translate(0,${(1 - ease(inU)) * 8})`);
}

function render(f) {
  f = clamp01(f);
  const STATIC = f >= 1;
  // lanes + scaffolding fade in
  LANES.forEach((L, i) => laneEls[L.id].setAttribute("opacity", ease(win(f, 0.0 + i * 0.01, 0.035 + i * 0.01))));
  ledgerHdr.setAttribute("opacity", ease(win(f, 0.03, 0.06)));
  foot.setAttribute("opacity", ease(win(f, 0.03, 0.06)));
  legend.setAttribute("opacity", ease(win(f, 0.0, 0.03)));
  labelEls.forEach((t) => t.setAttribute("opacity", ease(win(f, 0.05, 0.08))));
  platEls.forEach((t, i) => {
    const lit = win(f, 0.89 + i * 0.017, 0.902 + i * 0.017);
    t.setAttribute("fill", lit > 0.5 ? C.ink : C.dim);
    t.setAttribute("font-weight", lit > 0.5 ? 600 : 400);
    t.setAttribute("opacity", ease(win(f, 0.04, 0.07)));
  });
  // nodes appear in reading order, then light when reached
  NODE_ORDER.forEach((id, i) => {
    const ne = nodeEls[id];
    const appear = ease(win(f, 0.02 + i * 0.004, 0.05 + i * 0.004));
    ne.g.setAttribute("opacity", appear);
    const t0 = LIT[id];
    const lit = f >= t0 ? 1 : 0;
    const hot = f >= t0 ? 1 - win(f, t0, t0 + 0.03) : 0;
    setNodeLit(ne, lit, hot);
  });
  Object.entries(diaEls).forEach(([id, de], i) => {
    de.g.setAttribute("opacity", ease(win(f, 0.05 + i * 0.004, 0.08 + i * 0.004)));
    const t0 = id === "cls" ? 0.54 : id === "mny" ? 0.80 : 0.813;
    const hot = f >= t0 ? 1 - win(f, t0, t0 + 0.035) : 0;
    setDia(de, f >= t0 ? 1 : 0, hot);
  });
  Object.entries(pillEls).forEach(([label, pe], i) => {
    pe.g.setAttribute("opacity", ease(win(f, 0.06 + i * 0.003, 0.085 + i * 0.003)));
    const reached = f >= 0.575;
    const isRev = label === "REVIEW";
    pe.r.setAttribute("stroke", reached && isRev ? C.green : C.line);
    pe.r.setAttribute("fill", reached && isRev ? C.greenT : "#fff");
    pe.t.setAttribute("fill", reached && isRev ? C.green : reached ? "#b6c0cc" : C.dim);
  });
  // edges: ghost always (after appear), live draws on in its window
  Object.values(edgeEls).forEach((ee) => {
    ee.g.setAttribute("opacity", ease(win(f, 0.05, 0.08)));
    const u = win(f, ee.e.t[0], ee.e.t[1]);
    if (ee.e.dashed) {
      ee.live.setAttribute("opacity", u);
    } else {
      ee.live.setAttribute("stroke-dashoffset", ee.len * (1 - u));
    }
    if (ee.head) ee.head.setAttribute("opacity", u >= 0.98 ? 1 : 0);
    if (ee.e.dimEnd) ee.live.setAttribute("stroke", u >= 1 ? "#cbd5e1" : C.line);
  });
  // packets
  travel(PK.email, [[M.toAcq, 0.08, 0.117], [M.acqToIns, 0.255, 0.29]], f);
  if (f > 0.117 && f < 0.255) placePacket(PK.email, M.toAcq, 1, true);      // sits on the agent
  travel(PK.claims, [[M.acqToNrm, 0.453, 0.48], [M.nrmToGate, 0.48, 0.50], [M.gateToSlv, 0.50, 0.52], [M.slvToCls, 0.52, 0.54], [M.clsToRev, 0.56, 0.575]], f);
  if (f > 0.54 && f < 0.56) placePacket(PK.claims, M.slvToCls, 1, true);
  travel(PK.capex, [[M.insToNrm, 0.46, 0.495]], f);
  travel(PK.write, [[M.ledger, 0.672, 0.70]], f);
  travel(PK.draft, [[M.clsToSkp, 0.60, 0.63], [M.skpToMny, 0.78, 0.80], [M.mnyNo, 0.80, 0.813], [M.fstYes, 0.813, 0.826], [M.phToObx, 0.857, 0.868], [M.obxToBrk, 0.868, 0.879]], f);
  if (f > 0.63 && f < 0.78) placePacket(PK.draft, M.clsToSkp, 1, true);
  if (f > 0.826 && f < 0.857) placePacket(PK.draft, M.fstYes, 1, true);
  travel(PK.credit, [[M.skpToMny, 0.879, 0.891], [M.mnyYes, 0.891, 0.91], [M.phToObx, 0.936, 0.945], [M.obxToBrk, 0.945, 0.953]], f);
  if (f > 0.91 && f < 0.936) placePacket(PK.credit, M.mnyYes, 1, true);
  travel(PK.follow, [[M.skpToMny, 0.949, 0.96], [M.mnyNo, 0.96, 0.968], [M.fstNo, 0.968, 0.979], [M.obxToBrk, 0.979, 0.987]], f);
  travel(PK.reply, [[M.ret, 0.965, 0.995]], f);
  // chips
  chip(CH.acq, f, 0.14, 0.255); chip(CH.ins, f, 0.295, 0.40); chip(CH.slv, f, 0.525, 0.64);
  chip(CH.skp, f, 0.632, 0.745); chip(CH.tap, f, 0.834, 0.872); chip(CH.tap2, f, 0.915, 0.936);
  chip(CH.mem, f, 0.736, 0.81);
  // the boundary line gets its beat while the narration says "they never do arithmetic"
  const bnd = win(f, 0.36, 0.375) * (1 - win(f, 0.44, 0.455));
  foot.setAttribute("fill", bnd > 0.5 ? C.amber : C.dim);
  foot.setAttribute("font-weight", bnd > 0.5 ? 600 : 400);
  // ripples
  for (const [rp, a, b] of [[ripple, 0.83, 0.85], [ripple2, 0.913, 0.928]]) {
    const u = win(f, a, b);
    const on = u > 0 && u < 1;
    rp.setAttribute("opacity", on ? (1 - u) * 0.9 : 0);
    rp.setAttribute("r", on ? 8 + 44 * ease(u) : 0);
  }
  counter.textContent = f >= 0.70 ? "events 42" : "events 41";
  counter.setAttribute("fill", f >= 0.70 && f < 0.76 ? C.ink : C.dim);
  counter.setAttribute("opacity", ease(win(f, 0.05, 0.08)));
  if (STATIC) {
    Object.values(PK).forEach((pk) => pk.g.setAttribute("opacity", 0));
    Object.values(CH).forEach((g) => g.setAttribute("opacity", 0));
  }
}

// ------------------------------------------------------------------ public API
let playing = false, rafId = 0, t0 = 0;
window.seek = (ms) => { playing = false; if (rafId) cancelAnimationFrame(rafId); render(ms / DURATION); };
window.pause = () => { playing = false; if (rafId) cancelAnimationFrame(rafId); };
window.play = () => {
  playing = true; t0 = performance.now();
  const tick = (now) => {
    if (!playing) return;
    const ms = (now - t0) % (DURATION + 2000);       // hold on the end state for 2 s
    render(Math.min(1, ms / DURATION));
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
};
window.renderStatic = () => { window.pause(); render(1); };
const params = new URLSearchParams(location.search);
if (params.get("static") === "1") window.renderStatic();
else if (params.get("autoplay") !== "0") window.play();
else render(0);
})();
</script>
